{% if page.analytics != false %}

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  function bootGA(extra) {
    gtag('js', new Date());
    gtag('config', "{{ site.google_analytics_id }}", extra || {});
  }

  if (document.documentElement.getAttribute('data-page') === '404') {
    var reported404 = false;
    var missing = window.location.pathname || '/404.html';
    var noise = /\/(wp-admin|wp-login|xmlrpc|cgi-bin|\.git|wordpress|phpmyadmin)/i.test(missing)
      || /\.(php|aspx?|jsp|cgi|env|sql|bak)$/i.test(missing);
    window.__report404 = function () {
      if (reported404 || window.__404Redirecting || noise) return;
      reported404 = true;
      if (missing !== '/404.html' && missing !== '/404' && missing !== '/404/') {
        document.title = '404: ' + missing + ' | Yang Tan';
      }
      bootGA({
        page_title: document.title,
        page_path: missing,
        page_location: window.location.href
      });
      gtag('event', 'page_not_found', { page_path: missing });
    };
    if (!window.__404Redirecting && !noise) window.__report404();
    else setTimeout(function () { window.__report404(); }, 800);
  } else {
    bootGA();
  }
</script>

{% endif %}
