{% if page.analytics != false %}

{% if page.permalink == '/404.html' %}
<script>
  window.__report404 = function () {
    if (window.__404Reported || window.__404Redirecting) return;
    var missing = window.location.pathname || '/404.html';
    var noise = /\/(wp-admin|wp-login|xmlrpc|cgi-bin|\.git|wordpress|phpmyadmin)/i.test(missing)
      || /\.(php|aspx?|jsp|cgi|env|sql|bak)$/i.test(missing);
    if (noise) return;
    if (missing === '/404.html' || missing === '/404' || missing === '/404/') return;
    window.__404Reported = true;
    document.title = '404: ' + missing + ' | Yang Tan';
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics_id }}', { send_page_view: false });
    var extra = {
      page_title: document.title,
      page_path: missing,
      page_location: window.location.href
    };
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}';
    s.onload = function () {
      gtag('event', 'page_view', extra);
      gtag('event', 'page_not_found', { page_path: missing, page_title: document.title });
    };
    document.head.appendChild(s);
  };
</script>
{% else %}
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', "{{ site.google_analytics_id }}");
</script>
{% endif %}

{% endif %}
