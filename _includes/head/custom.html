<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="dns-prefetch" href="https://www.googletagmanager.com">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/shashengwan.png' | relative_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/shashengwan.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/shashengwan.png' | relative_url }}">
<link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}">

<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-TileImage" content="{{ '/images/mstile-144x144.png?v=M44lzPylqQ' | relative_url }}">
<meta name="msapplication-config" content="{{ '/images/browserconfig.xml?v=M44lzPylqQ' | relative_url }}">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>

{% if page.permalink == '/404.html' %}
<script>
  window.__404CFG = {
    index: {{ '/path-index.json' | relative_url | jsonify }},
    slugs: {{ site.data.projects | map: 'slug' | jsonify }}
  };
</script>
<script src="{{ '/assets/js/404-recover.js' | relative_url }}"></script>
{% endif %}

{% comment %} MathJax (~1MB) is only needed on note pages with formulas. {% endcomment %}
{% if page.layout == "post" or page.mathjax %}
<script>
  window.MathJax = {
    tex: {
      // 兼容 Typora 的行内公式 $...$
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      // 段落公式 $$...$$
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      packages: {'[+]': ['ams']}
    },
    options: {
      // 关键改动：从这个数组中删除了 'code'，允许 MathJax 处理代码块中的公式
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    loader: {
      load: ['[tex]/ams']
    }
  };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
