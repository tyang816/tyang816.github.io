<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3b7a"/>
      <stop offset="100%" stop-color="#241c42"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <circle cx="700" cy="40" r="160" fill="rgba(255,255,255,0.06)"/>
  <circle cx="80" cy="320" r="120" fill="rgba(0,0,0,0.08)"/>


  <g transform="translate(90,70)" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.9)" stroke-width="3">
    <rect x="0" y="140" width="70" height="110" rx="8"/>
    <rect x="100" y="80" width="70" height="170" rx="8"/>
    <rect x="200" y="40" width="70" height="210" rx="8"/>
    <rect x="300" y="100" width="70" height="150" rx="8"/>
    <rect x="400" y="20" width="70" height="230" rx="8" fill="rgba(243,227,176,0.28)" stroke="#f3e3b0"/>
  </g>
  <path d="M90 280 H640" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>

</svg>
